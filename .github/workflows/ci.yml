name: CI

on:
  push:
    branches: [master]
    paths: ['backend/**', 'modules/**', 'LlmFlows.slnx', 'Directory.*.props', 'global.json']
  pull_request:
    branches: [master]
    paths: ['backend/**', 'modules/**', 'LlmFlows.slnx', 'Directory.*.props', 'global.json']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore LlmFlows.slnx
      - run: dotnet build LlmFlows.slnx --no-restore
      - run: dotnet test --solution LlmFlows.slnx --no-build
